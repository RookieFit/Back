name: Build and Push Docker Image

on:
  push:
    branches:
      - main   # main 브랜치에 푸시될 때 자동으로 실행
  pull_request:
    branches:
      - main   # main 브랜치로의 PR이 열릴 때 실행

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub Actions에서 사용할 운영 체제 (Ubuntu 최신 버전)
    
    steps:
      - name: Check out the code
        uses: actions/checkout@v2  # 리포지토리 코드 체크아웃

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: '21'  # 자바 21 버전 설정

      - name: Set up Gradle
        uses: gradle/wrapper-validation-action@v1  # Gradle Wrapper 검증

      - name: Build with Gradle
        run: ./gradlew build -x test   # Gradle 빌드, 테스트는 제외

      - name: Build Docker image
        run: |
          docker build -t myapp:latest .   # Docker 이미지 빌드

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Docker Hub의 사용자 이름
          password: ${{ secrets.DOCKER_PASSWORD }}  # Docker Hub의 비밀번호

      - name: Push Docker image
        run: |
          docker tag myapp:latest pipakmj/myapp:latest   # Docker Hub에 태그 붙이기
          docker push pipakmj/myapp:latest   # Docker Hub로 푸시