name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: temurin
          java-version: '21'

      - name: Create application-api.properties from secrets
        working-directory: ./back
        run: |
          echo "${{ secrets.APPLICATION_API_PROPERTIES }}" > ./src/main/resources/application-api.properties
          ls -la ./src/main/resources/
          cat ./src/main/resources/application-api.properties

      - name: Grant execute permission for gradlew
        working-directory: ./back
        run: chmod +x gradlew

      - name: Build project (skip tests)
        working-directory: ./back
        run: ./gradlew clean build -x test

      - name: Build Docker image
        run: docker build -t myapp:latest -f ./back/Dockerfile .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to Docker Hub
        run: |
          docker tag myapp:latest pipakmj/myapp:latest
          docker push pipakmj/myapp:latest
