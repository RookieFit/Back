name: Build and Push Docker Image

on:
  push:
    branches:
      - dev   # dev 브랜치에 푸시될 때 자동으로 실행
  pull_request:
    branches:
      - dev   # dev 브랜치로의 PR이 열릴 때 실행

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub Actions에서 사용할 운영 체제 (Ubuntu 최신 버전)

    steps:
      - name: Check out the code
        uses: actions/checkout@v2  # 리포지토리 코드 체크아웃

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: temurin
          java-version: '21'  # 자바 21 버전 설정

      - name: Create application-api.properties and debug
        working-directory: ./back 
        run: |
          echo "${{ secrets.APPLICATION_API_PROPERTIES }}" > ./src/main/resources/application-api.properties
          ls -la ./src/main/resources/
          sudo cat ./src/main/resources/application-api.properties

      - name: Grant execute permission for gradlew
        working-directory: ./back
        run: chmod +x gradlew

      - name: 테스트 및 빌드하기
        working-directory: ./back
        run: ./gradlew clean build -x test

      - name: Build Docker image
        run: docker build -t myapp:latest -f ./back/Dockerfile .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Docker Hub의 사용자 이름
          password: ${{ secrets.DOCKER_PASSWORD }}  # Docker Hub의 비밀번호

      - name: Push Docker image
        run: |
          docker tag myapp:latest pipakmj/myapp:latest   # Docker Hub에 태그 붙이기
          docker push pipakmj/myapp:latest   # Docker Hub로 푸시
