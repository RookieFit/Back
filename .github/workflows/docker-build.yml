name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: temurin
          java-version: '21'

      - name: Create application-api.properties from secrets
        working-directory: ./back
        run: |
          echo "${{ secrets.APPLICATION_API_PROPERTIES }}" > ./src/main/resources/application-api.properties
          ls -la ./src/main/resources/
          cat ./src/main/resources/application-api.properties

      - name: Grant execute permission for gradlew
        working-directory: ./back
        run: chmod +x gradlew

      - name: Build the project
        working-directory: ./back
        run: ./gradlew clean build -x test

      - name: Build Docker image
        run: docker build -t myapp:latest -f ./back/Dockerfile .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker image
        run: docker tag myapp:latest pipakmj/myapp:latest

      - name: Push Docker image to Docker Hub
        run: docker push pipakmj/myapp:latest  # 이 부분을 추가해야 이미지를 Docker Hub로 푸시합니다.

      - name: SSH 접속
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "Starting deploy process"
            docker pull ***/myapp:latest
            docker stop myapp_container || echo "myapp_container does not exist"
            docker rm myapp_container || echo "myapp_container does not exist"
            docker run -d --name myapp_container -p 4040:4040 ***/myapp:latest

