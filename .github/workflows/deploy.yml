name: Deploy To EC2

on:
  push:
    branches:
      - Deployment-Workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: JDK 21버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: application.yml 파일 만들기
        working-directory: ./back  # 이 단계에서 ./back 디렉토리로 이동
        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.yml

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./back

      - name: 테스트 및 빌드하기
        run: ./gradlew clean build -x test
        working-directory: ./back

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2  

      - name: Set working directory
        run: |
          echo "Current working directory:"
          pwd

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}


      - name: Build Docker image
        run: cd /home/ubuntu/Back/back && docker build -t rookiefitserver -f Dockerfile .
        working-directory: /home/ubuntu/Back/back


      - name: Docker 이미지에 Tag 붙이기
        working-directory: ./back
        run: docker tag rookiefitserver ${{ steps.login-ecr.outputs.registry }}/rookiefitserver:latest

      - name: ECR에 Docker 이미지 Push하기
        working-directory: ./back
        run: docker push ${{ steps.login-ecr.outputs.registry }}/rookiefitserver:latest

      - name: SSH로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            docker stop rookiefitserver || true
            docker rm rookiefitserver || true
            docker pull ${{ steps.login-ecr.outputs.registry }}/rookiefitserver:latest
            docker run -d --name rookiefitserver -p 8080:8080 ${{ steps.login-ecr.outputs.registry }}/rookiefitserver:latest
