name: EC2 배포 워크플로우

on:
  push:
    branches:
      - Deployment-Workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: application-api.properties 생성
        working-directory: ./back
        run: echo "${{ secrets.APPLICATION_API_PROPERTIES }}" > ./src/main/resources/application-api.properties

      - name: gradlew 권한 부여
        run: chmod +x ./gradlew
        working-directory: ./back

      - name: 프로젝트 빌드
        run: ./gradlew clean build -x test
        working-directory: ./back

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Amazon ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2  

      - name: Docker 이미지 빌드 및 Push
        run: |
          docker build -t rookiefit-server ./back
          docker tag rookiefit-server ${{ steps.ecr-login.outputs.registry }}/rookiefit-server:latest
          docker push ${{ steps.ecr-login.outputs.registry }}/rookiefit-server:latest

      - name: start-new-server.sh 업로드
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ./back/start-new-server.sh
          target: ~/start-new-server.sh


      - name: EC2에 SSH로 접속하여 권한 부여 및 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x ~/start-new-server.sh
            ./start-new-server.sh
