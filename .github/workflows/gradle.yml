name: Deploy to EC2

# 트리거 설정: 코드가 push될 때마다 실행
on:
  push:
    branches:
      - main  # main 브랜치에 푸시될 때 실행

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub의 최신 우분투 환경에서 실행

    steps:
    # 1. 코드를 체크아웃합니다.
    - name: Checkout code
      uses: actions/checkout@v2

    # 2. JDK 설정 (Java 21 설치)
    - name: Set up JDK 21
      uses: actions/setup-java@v2
      with:
        java-version: '21'

    # 3. Gradle 설치
    - name: Set up Gradle
      uses: gradle/wrapper-validation-action@v2

    # 4. Gradle 빌드 실행
    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    # 5. AWS EC2에 배포
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.3
      with:
        host: ${{ secrets.EC2_HOST }}  # EC2 IP 주소
        username: ${{ secrets.EC2_USER }}  # EC2 사용자
        key: ${{ secrets.EC2_SSH_KEY }}  # EC2 SSH 비공개 키
        script: |
          # EC2 서버에서 필요한 작업 수행
          cd /home/ubuntu/CStudy  # EC2 서버 디렉토리
          sudo docker-compose down  # 이전 컨테이너 종료
          sudo docker-compose up -d  # 새로운 컨테이너 실행
